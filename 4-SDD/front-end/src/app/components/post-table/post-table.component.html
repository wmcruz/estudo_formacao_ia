<div class="table-container mat-elevation-z8">
  
  <div class="loading-shade" *ngIf="loading">
    <mat-spinner></mat-spinner>
  </div>

  <div class="error-container" *ngIf="errorMessage && !loading" aria-live="polite">
    <mat-card class="error-card">
      <mat-card-content>
        <mat-icon color="warn">error</mat-icon>
        <span class="error-message">{{ errorMessage }}</span>
      </mat-card-content>
    </mat-card>
  </div>

  <table mat-table [dataSource]="dataSource" class="post-table">
    
    <!-- ID Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let element"> {{element.id}} </td>
    </ng-container>

    <!-- User ID Column -->
    <ng-container matColumnDef="userId">
      <th mat-header-cell *matHeaderCellDef> User ID </th>
      <td mat-cell *matCellDef="let element"> {{element.userId}} </td>
    </ng-container>

    <!-- Title Column -->
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef> Título </th>
      <td mat-cell *matCellDef="let element" class="title-cell"> {{element.title}} </td>
    </ng-container>

    <!-- Body Column -->
    <ng-container matColumnDef="body">
      <th mat-header-cell *matHeaderCellDef> Body </th>
      <td mat-cell *matCellDef="let element" class="body-cell"> {{element.body}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    
    <!-- Row shown when there is no matching data. -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell empty-cell" colspan="4" *ngIf="!loading && !errorMessage">
        Nenhum post encontrado.
      </td>
    </tr>
  </table>

  <mat-paginator [pageSizeOptions]="[10, 25, 50]"
                 [pageSize]="10"
                 showFirstLastButtons
                 aria-label="Selecionar página de posts">
  </mat-paginator>
</div>
